<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd36f"/>
      <stop offset="100%" stop-color="#1a6b3c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#111318"/>
  <!-- Wheat stalk -->
  <path d="M32 52V20" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
